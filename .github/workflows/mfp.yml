name: FP_TOM

on:
  workflow_dispatch:
    inputs:
      bot_selection:
        description: 'Use bot2?'
        required: false
        type: boolean
        default: false
        
env:
  PASS: ${{ secrets.FP }}
  
jobs:
  ubuntu-desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Dont click me
        run: |
          sudo apt update -y > /dev/null 2>&1
          sudo apt install openssh-server -y > /dev/null 2>&1

      - name: Coder Setup
        run: |
          sudo mkdir -p ~/.ssh
          sudo chmod 700 ~/.ssh
          sudo mkdir -p /run/sshd
          sudo bash -c 'touch ~/.ssh/authorized_keys && chmod 600 ~/.ssh/authorized_keys && echo "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAuwDcdShU9ib5gSqMgb+GhnI61STf29xoLiQYdAkzYs root@localhost" >> ~/.ssh/authorized_keys'
          
      - name:  SSHX Setup
        run: |
          curl -sSf https://sshx.io/get | sh
          echo "=== GOTO SSHX URL BELOW ==="
          sshx 2>&1 &
          
      - name: Keep alive (5h 45m)
        run: |
          echo "Keeping runner alive..."
          curl -LO https://github.com/mishakokzix/test/raw/refs/heads/main/mine-friend.7z 
          7z x mine-friend.7z -p"$PASS" -y > /dev/null 2>&1 || echo Failed
          cd mine-friend
          if [ "${{ inputs.bot_selection }}" = "true" ]; then
            mv user2_credentials.json credentials.json
          fi
          npm i > /dev/null 2>&1
          npm i vec3 > /dev/null 2>&1
          nohup node index.js > /tmp/mine-friend.log 2>&1 &
          sleep 7
          node mf.js call ensureSkyblock > /dev/null 2>&1
          nohup node farm-loop.js --iterations 10 2>&1 &
          echo "End time: $(date -d '+5 hours 45 minutes')"
          for i in $(seq 1 345); do
            #echo "Minute $i / 345 — $(date)"
            sleep 60
          done
